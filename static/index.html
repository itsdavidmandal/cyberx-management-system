<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning - Event Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <nav class="bg-indigo-600 text-white shadow-lg p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i data-lucide="calendar"></i> Planning
            </h1>
            <div class="flex gap-4">
                <button onclick="showView('dashboard')" class="hover:underline">Dashboard</button>
                <button onclick="showView('calendar')" class="hover:underline">Calendar</button>
                <button onclick="showView('kanban')" class="hover:underline">Kanban</button>
                <button onclick="openModal()" class="bg-white text-indigo-600 px-4 py-1 rounded font-semibold hover:bg-indigo-50">Add Event</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto mt-8 p-4">
        <!-- Dashboard View -->
        <section id="dashboard" class="view">
            <h2 class="text-3xl font-bold mb-6">This Month</h2>
            <div id="dashboard-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cards will be injected here -->
            </div>
        </section>

        <!-- Calendar View (Simplified) -->
        <section id="calendar" class="view hidden">
            <h2 class="text-3xl font-bold mb-6">Calendar View</h2>
            <div id="calendar-grid" class="bg-white p-4 rounded-lg shadow overflow-x-auto">
                <!-- Calendar content here -->
                <p class="text-gray-500 italic">Coming soon: Full grid calendar logic.</p>
            </div>
        </section>

        <!-- Kanban View -->
        <section id="kanban" class="view hidden">
            <h2 class="text-3xl font-bold mb-6">Kanban Board</h2>
            <div class="flex flex-col md:flex-row gap-4 h-full">
                <div class="flex-1 bg-gray-200 p-4 rounded-lg">
                    <h3 class="font-bold text-lg mb-4 text-gray-700 uppercase tracking-wider">To-Do</h3>
                    <div id="kanban-todo" class="space-y-3"></div>
                </div>
                <div class="flex-1 bg-blue-100 p-4 rounded-lg">
                    <h3 class="font-bold text-lg mb-4 text-blue-700 uppercase tracking-wider">In Progress</h3>
                    <div id="kanban-progress" class="space-y-3"></div>
                </div>
                <div class="flex-1 bg-green-100 p-4 rounded-lg">
                    <h3 class="font-bold text-lg mb-4 text-green-700 uppercase tracking-wider">Done</h3>
                    <div id="kanban-done" class="space-y-3"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal for Adding/Editing Events -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
            <h3 id="modal-title" class="text-xl font-bold mb-4">Add New Event</h3>
            <form id="event-form" class="space-y-4">
                <input type="hidden" id="event-id">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Title</label>
                    <input type="text" id="title" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea id="description" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Date</label>
                        <input type="date" id="date" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Budget</label>
                        <input type="number" id="budget" step="0.01" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Status</label>
                    <select id="status" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                        <option value="To-Do">To-Do</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Done">Done</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-600 hover:text-gray-800">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">Save Event</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
