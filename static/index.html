<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning - Event Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#1c5070',
                            red: '#ae0001',
                            blue: '#44a6cc',
                            gray: '#383838',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-brand-gray font-sans">
    <nav class="bg-brand-dark text-white shadow-lg p-3">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="/static/assets/logo.jpeg" alt="Logo" class="w-10 h-10 rounded-full border-2 border-brand-blue object-cover">
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    Planning
                </h1>
            </div>
            <div class="flex gap-6 items-center">
                <div class="flex gap-4">
                    <button onclick="showView('dashboard')" class="hover:text-brand-blue transition-colors font-medium">Dashboard</button>
                    <button onclick="showView('calendar')" class="hover:text-brand-blue transition-colors font-medium">Calendar</button>
                    <button onclick="showView('kanban')" class="hover:text-brand-blue transition-colors font-medium">Kanban</button>
                </div>
                <button onclick="openModal()" class="bg-white text-brand-dark px-4 py-1.5 rounded-lg font-bold hover:bg-brand-blue hover:text-white transition-all shadow-md">
                    + Add Task
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto mt-8 p-4">
        <!-- Dashboard View -->
        <section id="dashboard" class="view">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-extrabold text-brand-dark">This Month</h2>
                <div class="flex gap-2">
                    <button onclick="openProjectModal()" class="flex items-center gap-2 bg-brand-blue/10 text-brand-blue px-4 py-2 rounded-lg shadow-sm hover:bg-brand-blue/20 transition-colors font-bold border border-brand-blue/20">
                        <i data-lucide="plus-circle"></i> New Project
                    </button>
                    <button onclick="exportCSV()" class="flex items-center gap-2 bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg shadow-sm hover:bg-gray-50 transition-colors">
                        <i data-lucide="download"></i> CSV
                    </button>
                    <button onclick="exportPDF()" class="flex items-center gap-2 bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg shadow-sm hover:bg-gray-50 transition-colors">
                        <i data-lucide="file-text"></i> PDF
                    </button>
                </div>
            </div>
            <div id="dashboard-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
                <!-- Cards will be injected here -->
            </div>

            <div class="border-t border-gray-200 pt-8">
                <h2 class="text-3xl font-extrabold text-brand-dark mb-6 flex items-center gap-2">
                    <i data-lucide="lightbulb" class="text-brand-red"></i> Ideation Zone
                </h2>
                <div id="ideation-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Ideation cards will be injected here -->
                </div>
            </div>
        </section>

        <!-- Calendar View -->
        <section id="calendar" class="view hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-extrabold text-brand-dark">Calendar</h2>
                <div class="flex items-center gap-4 bg-white shadow-md rounded-xl p-2 border border-gray-100">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 rounded-full transition-colors text-brand-dark">
                        <i data-lucide="chevron-left"></i>
                    </button>
                    <span id="current-month-display" class="text-lg font-bold min-w-[180px] text-center text-brand-dark">Month Year</span>
                    <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-100 rounded-full transition-colors text-brand-dark">
                        <i data-lucide="chevron-right"></i>
                    </button>
                </div>
            </div>
            
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
                <div class="grid grid-cols-7 bg-brand-dark/5 border-b border-gray-200">
                    <div class="p-4 text-center text-xs font-black text-brand-dark/60 uppercase tracking-widest">Sun</div>
                    <div class="p-4 text-center text-xs font-black text-brand-dark/60 uppercase tracking-widest">Mon</div>
                    <div class="p-4 text-center text-xs font-black text-brand-dark/60 uppercase tracking-widest">Tue</div>
                    <div class="p-4 text-center text-xs font-black text-brand-dark/60 uppercase tracking-widest">Wed</div>
                    <div class="p-4 text-center text-xs font-black text-brand-dark/60 uppercase tracking-widest">Thu</div>
                    <div class="p-4 text-center text-xs font-black text-brand-dark/60 uppercase tracking-widest">Fri</div>
                    <div class="p-4 text-center text-xs font-black text-brand-dark/60 uppercase tracking-widest">Sat</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 divide-x divide-y divide-gray-100">
                    <!-- Days will be injected here -->
                </div>
            </div>
        </section>

        <!-- Kanban View -->
        <section id="kanban" class="view hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-extrabold text-brand-dark">Kanban Board</h2>
                <button onclick="openProjectModal()" class="bg-brand-dark text-white px-6 py-2.5 rounded-lg font-bold hover:bg-brand-blue transition-all flex items-center gap-2 shadow-lg">
                    <i data-lucide="plus-circle"></i> New Project
                </button>
            </div>
            <div id="kanban-swimlanes" class="space-y-12">
                <!-- Project Swimlanes will be injected here -->
            </div>
        </section>
    </main>

    <!-- Modal for Adding/Editing Tasks -->
    <div id="modal" class="fixed inset-0 bg-brand-dark/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 border border-white/20">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modal-title" class="text-2xl font-black text-brand-dark">Add New Task</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-brand-red transition-colors">
                    <i data-lucide="x" class="w-8 h-8"></i>
                </button>
            </div>
            <form id="event-form" class="space-y-5">
                <input type="hidden" id="event-id">
                <div>
                    <label class="block text-sm font-bold text-brand-dark mb-1">Title</label>
                    <input type="text" id="title" required class="block w-full border-2 border-gray-100 rounded-xl bg-gray-50 p-3 focus:ring-brand-blue focus:border-brand-blue outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-bold text-brand-dark mb-1">Project</label>
                    <select id="project-id-select" class="block w-full border-2 border-gray-100 rounded-xl bg-gray-50 p-3 focus:ring-brand-blue focus:border-brand-blue outline-none transition-all">
                        <option value="">Unassigned</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-brand-dark mb-1">Description</label>
                    <textarea id="description" rows="3" class="block w-full border-2 border-gray-100 rounded-xl bg-gray-50 p-3 focus:ring-brand-blue focus:border-brand-blue outline-none transition-all"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-brand-dark mb-1">Date</label>
                        <input type="date" id="date" required class="block w-full border-2 border-gray-100 rounded-xl bg-gray-50 p-3 focus:ring-brand-blue focus:border-brand-blue outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-brand-dark mb-1">Budget</label>
                        <input type="number" id="budget" step="0.01" class="block w-full border-2 border-gray-100 rounded-xl bg-gray-50 p-3 focus:ring-brand-blue focus:border-brand-blue outline-none transition-all">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-brand-dark mb-1">Status</label>
                    <select id="status" class="block w-full border-2 border-gray-100 rounded-xl bg-gray-50 p-3 focus:ring-brand-blue focus:border-brand-blue outline-none transition-all">
                        <option value="Ideation">Ideation</option>
                        <option value="To-Do">To-Do</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Done">Done</option>
                    </select>
                </div>
                <div class="flex justify-end gap-3 mt-8">
                    <button type="button" onclick="closeModal()" class="px-6 py-2.5 text-gray-500 font-bold hover:text-brand-red transition-colors">Cancel</button>
                    <button type="submit" class="px-8 py-2.5 bg-brand-dark text-white rounded-xl font-black hover:bg-brand-blue transition-all shadow-lg">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Adding Projects -->
    <div id="project-modal" class="fixed inset-0 bg-brand-dark/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 border border-white/20">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-black text-brand-dark">Create Project</h3>
                <button onclick="closeProjectModal()" class="text-gray-400 hover:text-brand-red transition-colors">
                    <i data-lucide="x" class="w-8 h-8"></i>
                </button>
            </div>
            <form id="project-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-brand-dark mb-1">Project Name</label>
                    <input type="text" id="project-name" required class="block w-full border-2 border-gray-100 rounded-xl bg-gray-50 p-3 focus:ring-brand-blue focus:border-brand-blue outline-none transition-all">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-brand-dark mb-1">Start Date</label>
                        <input type="date" id="project-start-date" class="block w-full border-2 border-gray-100 rounded-xl bg-gray-50 p-3 focus:ring-brand-blue focus:border-brand-blue outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-brand-dark mb-1">End Date</label>
                        <input type="date" id="project-end-date" class="block w-full border-2 border-gray-100 rounded-xl bg-gray-50 p-3 focus:ring-brand-blue focus:border-brand-blue outline-none transition-all">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-brand-dark mb-1">Description</label>
                    <textarea id="project-description" rows="3" class="block w-full border-2 border-gray-100 rounded-xl bg-gray-50 p-3 focus:ring-brand-blue focus:border-brand-blue outline-none transition-all"></textarea>
                </div>
                <div class="flex justify-end gap-3 mt-8">
                    <button type="button" onclick="closeProjectModal()" class="px-6 py-2.5 text-gray-500 font-bold hover:text-brand-red transition-colors">Cancel</button>
                    <button type="submit" class="px-8 py-2.5 bg-brand-dark text-white rounded-xl font-black hover:bg-brand-blue transition-all shadow-lg">Create Project</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/script.js?v=1.3"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
